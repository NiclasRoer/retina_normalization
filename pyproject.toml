[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retina_normalization"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "matplotlib",
    "numpy",
    "tqdm",
    "torch",
    "torchvision",
    "fvcore",
    "timm",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utility_functions*", "measurement_functions*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["E501", "D203", "D213", "D401", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]